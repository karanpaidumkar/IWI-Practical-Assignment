<!DOCTYPE html>
<html>
<head>
    <title>Sum of Array Elements</title>
</head>
<body>

<h2>Sum of All Numbers in an Array</h2>

<div id="result"></div>

<script>

    let numbers = [10, 20, 30, 40, 50, 60];

    let sum = 0;
    for (let i = 0; i < numbers.length; i++) {
        sum += numbers[i];
    }

    document.getElementById("result").innerHTML =
        "Array: " + numbers + "<br>" +
        "Sum of all numbers: " + sum;
</script>

</body>
</html>
