<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
    <style>
        body {
            background-color: white;

        }

        .container {
            align-items: center;
            border-radius: 20px;
            margin: 10% 38%;
            height: 30rem;
            width: 25rem;
            box-shadow: 1px 1px 50px grey;
        }

        .photo {
            align-items: center;
            justify-content: center;
            display: flex;
        }

        img {
            width: 10rem;
            height: 10rem;
            border: 2px rgb(232, 9, 9) solid;
            border-radius: 50%;
            margin-top: 10px;
        }

        .name {
            align-items: center;
            justify-content: center;
            display: flex;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: green;
        }

        .description {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: black;
            font-size: 15px;
        }

        .contact button{
            align-items: center;
            justify-content: center;
            display: flex;
            font-size: 15px;
            margin-top: 30px;
            margin-left: 145px;
            margin-right: 140px;
            padding: 15px;
            border: 1px solid rgb(0, 174, 255);
            border-radius: 10px;
            color: white;
            background-color: rgb(0, 174, 255);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="photo">
            <img src="Karan's portfolio image.jpg" alt="">
        </div>
        <div class="name">
            <h4>Karan Paidumkar</h4>
        </div>
        <div class="description">
            <p>Hello! My name is Karan Paidumkar, currently pursuing Bachelor's Of Computer Application in
                specialization with Artificial Intelligence & Machine Learning from Rungta International Skills
                University. My hobbies are dancing, singing, listening to music, etc. </p>
        </div>
        <div class="contact">
           <button>Contact Me</button> 
        </div>
    </div>
</body>

</html>
