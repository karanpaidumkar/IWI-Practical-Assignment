<!DOCTYPE html>
<html>
<head>
    <title>Check Even Number</title>
</head>
<body>

<h2>Check if a Number is Even (Arrow Function)</h2>

<div id="output"></div>

<script>
    const isEven = (num) => num % 2 === 0;
    let number = 12;
    document.getElementById("output").innerHTML =
        "Number: " + number + "<br>" +
        "Is Even? : " + isEven(number);
</script>

</body>
</html>
