4.3 Merge two arrays using the spread operator

<!DOCTYPE html>
<html>
<head>
    <title>Merge Arrays Using Spread Operator</title>
</head>
<body>

<h2>Merge Two Arrays Using Spread Operator</h2>

<div id="output"></div>

<script>
    let array1 = [1, 2, 3];
    let array2 = [4, 5, 6];

    let mergedArray = [...array1, ...array2];

    document.getElementById("output").innerHTML =
        "Array 1: " + array1 + "<br>" +
        "Array 2: " + array2 + "<br>" +
        "Merged Array: " + mergedArray;
</script>

</body>
</html>
