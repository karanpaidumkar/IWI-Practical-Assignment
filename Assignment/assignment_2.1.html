<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .wrapper {
            justify-content: space-between;
            display: flex;
            height: 90px;
        }

        .heading {
            font-weight: bold;
            font-family: "Impallari Type", "poppins", sans-serif;
            font-size: 50px;
            margin-left: 30px;
        }
        
        .navbar{
            margin-top: 30px;
            font-size: 20px;
        }

        .navbar a{
            margin: 0 30px;
            text-align: left;
            text-decoration: none;
            color: black;
        }

        .navbar a:hover{
            border-bottom: 3px solid grey;
            transition: 0.08s ;
        }

        .btn button{
            border: 4px solid rgb(0, 176, 235);
            border-width: 2px;
            padding: 9px;
            font-size: 17px;
            background-color: rgb(0, 176, 235);
            color: white;
            border-radius: 20px;
            margin-top: 40px;
        }

        .mainsec {
            justify-content: space-around;
            display: flex;
            background: linear-gradient(to right, #d7d7d7, #f8f8f8);
            height: 30rem;
        }

        .rightsec {
            text-align: left;
            margin-top: 140px;
            font-size: 20px;
            font-family: sans-serif, "poppins";
        }
        .rightsec .free{
            font-weight: bold;
        }

        .leftsec{
            margin-top: 84px ;
        }

.footer{
    margin-left: 34rem;
    margin-top: 5rem;
}
        .footer i{
            display: inline;
            margin-left: 40px;
            font-size: 40px;

        }
    </style>
</head>

<body>
    <header class="wrapper">
        <div class="heading">
            GAMEEZZ
        </div>
        <div>
            <nav class="navbar">
                <a href="">Home</a>
                <a href="">Contact</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="mainsec">
            <div class="rightsec">
                Download PC games
                <div class="free">For FREE</div>
                Our Website has thousands of games of your choice. <br>Click on the
                Download button and choose your file
                format
                to download(torrent, zip, 7z, rar). <br>
                Extract, setup the file and enjoy your game!
                <br>
                <span class="btn"><button>Read More</button></span>
            </div>
            <div class="leftsec">
                <img src="firstimg-removebg-preview.png" alt="">

            </div>
        </div>
    </main>
    <footer>
        <div class="footer">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-whatsapp"></i>
            <i class="fa-brands fa-youtube"></i>
            <i class="fa-brands fa-github"></i>
        </div>
    </footer>
</body>

</html>
